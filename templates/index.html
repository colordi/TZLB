<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 林业调查工作单助手</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="background-blobs">
        <div class="blob"></div>
    </div>

    <div class="container">
        <h1>🌲 派单生成助手</h1>

        <div class="config-section">
            <div class="input-group">
	                <label>害虫类型</label>
	                <select id="pestType" onchange="handlePestTypeChange()">
	                    <option value="" disabled selected>请选择害虫类型</option>
	                    <option value="春尺蠖">春尺蠖</option>
	                    <option value="美国白蛾">美国白蛾</option>
	                    <option value="杨树食叶害虫">杨树食叶害虫</option>
	                    <option value="松材线虫">松材线虫</option>
	                    <option value="其它">其它</option>
	                </select>
	            </div>
            <div class="input-group">
                <label>统防任务</label>
                <select id="taskType">
                    <option value="">（空白）</option>
                    <option value="第一代">第一代</option>
                    <option value="第二代">第二代</option>
                    <option value="第三代">第三代</option>
                    <option value="越冬代">越冬代</option>
                </select>
            </div>
        </div>

        <!-- AI文本解析区域 -->
        <div class="ai-parse-section">
            <div class="ai-parse-header">
                <label>📝 粘贴调查记录文本（支持自由格式）</label>
                <button class="btn-ai-parse" onclick="parseTextWithAI()">🤖 AI智能解析</button>
            </div>
            <textarea id="aiTextInput" class="ai-text-input"
                placeholder="在此粘贴调查记录文本，例如：&#10;2025年1月15日，在某镇的道路绿化带发现美国白蛾网幕3个，受害杨树5株，点位编号L001...&#10;&#10;AI将自动识别并提取信息填充到下方表格中"></textarea>
            <div id="aiParseStatus" class="ai-parse-status"></div>
        </div>

        <!-- 卡片式数据容器 -->
        <div class="records-container" id="recordsContainer">
            <!-- 记录卡片将通过 JS 动态添加 -->
        </div>
        <button class="btn-add" onclick="addRow()">+ 添加一行调查数据</button>

        <div class="actions">
            <button class="btn-generate" onclick="generateDocs()">🚀 批量生成工作单</button>
            <button class="btn-save-db" id="btnSaveDb" onclick="saveToDatabase()" style="display:none">💾 保存到数据库</button>
        </div>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        // 字段配置：分两行布局
	        const FIELDS_ROW1 = [
	            { key: "survey_date", label: "调查日期", type: "date" },
	            { key: "region", label: "区域", type: "select", options: ["乡镇", "城区"] },
	            { key: "town_or_street", label: "乡镇/街道", type: "text" },
	            { key: "location_id", label: "点位编号", type: "text" },
	            { key: "location_name", label: "点位名称", type: "text" },
	            { key: "occurrence_position", label: "发生位置", type: "text" }
	        ];

	        const FIELDS_ROW2 = [
	            { key: "land_type", label: "地块类型", type: "text", hideable: true },
	            { key: "host_plant", label: "危害寄主", type: "text", hideable: true },
	            { key: "damaged_count", label: "受害株数", type: "text", hideable: true },
	            { key: "web_count", label: "网幕数", type: "text", hideable: true },
	            { key: "total_insect_count", label: "总虫口数", type: "number", hideable: true },
	            { key: "damage_level", label: "受害程度", type: "text", hideable: true },
	            { key: "report_time", label: "上报时间", type: "text", hideable: true, placeholder: "自动生成" },
	            { key: "description", label: "详细情况描述", type: "textarea", wide: true },
	            { key: "note", label: "备注", type: "text", hideable: true }
	        ];

	        const ALL_FIELDS = [...FIELDS_ROW1, ...FIELDS_ROW2];

	        // 默认模式（非春尺蠖）显示字段
	        const DEFAULT_VISIBLE_FIELD_KEYS = new Set([
	            "survey_date",
	            "region",
	            "town_or_street",
	            "location_id",
	            "location_name",
	            "occurrence_position",
	            "land_type",
	            "host_plant",
	            "damaged_count",
	            "web_count",
	            "description",
	            "note"
	        ]);

	        // 春尺蠖上报单模式：显示字段与数据库（chunchihuo_reports）保持一致
	        const CHUNCHIHUO_VISIBLE_FIELD_KEYS = new Set([
	            "survey_date",
	            "region",
	            "town_or_street",
	            "location_id",
	            "location_name",
	            "occurrence_position",
	            "land_type",
	            "total_insect_count",
	            "damage_level",
	            "report_time",
	            "description"
	        ]);

	        // 春尺蠖模式下，仍保留但不展示的字段默认值（用于不影响现有工作单生成逻辑）
	        const CHUNCHIHUO_HIDDEN_FIELD_DEFAULTS = {
	            "host_plant": "杨树",
	            "damaged_count": "10",
	            "web_count": "0",
	            "note": ""
	        };

	        const DEFAULT_ROW = {
	            survey_date: new Date().toISOString().split('T')[0],
	            region: "乡镇",
	            town_or_street: "",
	            location_id: "",
	            location_name: "",
	            occurrence_position: "",
	            land_type: "",
	            host_plant: "",
	            damaged_count: "10",
	            web_count: "0",
	            total_insect_count: "",
	            damage_level: "",
	            report_time: "",
	            description: "",
	            note: ""
	        };

        // 用于存储每行的图片数据 (Base64)
        const rowImagesMap = new Map();
        let rowIdCounter = 0;

        // 日期格式转换函数：兼容多种 Excel 导出格式
	        function parseDate(dateStr) {
            if (!dateStr) return "";

            // 如果已经是 yyyy-mm-dd 格式，直接返回
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                return dateStr;
            }

            // 处理 yyyy/mm/dd 或 yyyy.mm.dd 格式
            let match = dateStr.match(/^(\d{4})[\/\.\-](\d{1,2})[\/\.\-](\d{1,2})/);
            if (match) {
                const [_, year, month, day] = match;
                return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
            }

            // 处理 dd/mm/yyyy 或 mm/dd/yyyy 格式（假设为 mm/dd/yyyy，美国格式）
            match = dateStr.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})/);
            if (match) {
                const [_, first, second, year] = match;
                // 假设第一部分是月份，第二部分是日期（美国格式）
                return `${year}-${first.padStart(2, '0')}-${second.padStart(2, '0')}`;
            }

            // 处理 Excel 序列号（数字日期，如 44927 代表 2023-01-01）
            const numDate = parseFloat(dateStr);
            if (!isNaN(numDate) && numDate > 30000 && numDate < 60000) {
                // Excel 序列号转换为 JavaScript 日期
                const excelEpoch = new Date(1899, 11, 30); // Excel 的起始日期
                const jsDate = new Date(excelEpoch.getTime() + numDate * 24 * 60 * 60 * 1000);
                const year = jsDate.getFullYear();
                const month = String(jsDate.getMonth() + 1).padStart(2, '0');
                const day = String(jsDate.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // 尝试用 Date 对象解析
            const parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) {
                const year = parsed.getFullYear();
                const month = String(parsed.getMonth() + 1).padStart(2, '0');
                const day = String(parsed.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // 无法解析，返回原值
	            return dateStr;
	        }

	        // 获取当前本地时间字符串（YYYY-MM-DD HH:MM:SS）
	        function getCurrentDateTimeString() {
	            const now = new Date();
	            const year = now.getFullYear();
	            const month = String(now.getMonth() + 1).padStart(2, '0');
	            const day = String(now.getDate()).padStart(2, '0');
	            const hours = String(now.getHours()).padStart(2, '0');
	            const minutes = String(now.getMinutes()).padStart(2, '0');
	            const seconds = String(now.getSeconds()).padStart(2, '0');
	            return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
	        }

	        // 创建输入元素的辅助函数
	        function createInputElement(fieldConfig, value) {
	            const { key, type, options, wide, placeholder } = fieldConfig;
	            let element;

	            if (type === "textarea") {
	                element = document.createElement("textarea");
	                element.rows = 2;
	                element.value = value || '';
	            } else if (type === "select") {
	                element = document.createElement("select");
	                options.forEach(opt => {
	                    const option = document.createElement("option");
	                    option.value = opt;
	                    option.textContent = opt;
	                    if (opt === value) option.selected = true;
	                    element.appendChild(option);
	                });
	            } else if (type === "date") {
	                element = document.createElement("input");
	                element.type = "date";
	                element.value = parseDate(value || '');
	            } else if (type === "number") {
	                element = document.createElement("input");
	                element.type = "number";
	                element.step = "1";
	                element.value = value || '';
	            } else {
	                element = document.createElement("input");
	                element.type = "text";
	                element.value = value || '';
	            }

	            element.setAttribute("data-key", key);
	            if (placeholder) element.placeholder = placeholder;
	            if (wide) element.classList.add("wide-input");
	            return element;
	        }

        function addRow(data = DEFAULT_ROW) {
            const card = document.createElement("div");
            card.className = "record-card";
            const rowId = `row_${rowIdCounter++}`;
            card.setAttribute("data-row-id", rowId);
            rowImagesMap.set(rowId, []);

            // 卡片头部：显示行号
            const cardHeader = document.createElement("div");
            cardHeader.className = "card-header";
            cardHeader.innerHTML = `<span class="row-number">第 <strong>--</strong> 条记录</span>`;
            card.appendChild(cardHeader);

            // 第一行字段
            const row1 = document.createElement("div");
            row1.className = "card-row";
            FIELDS_ROW1.forEach(fieldConfig => {
                const fieldDiv = document.createElement("div");
                fieldDiv.className = `field-group field-${fieldConfig.key}`;

                const label = document.createElement("label");
                label.textContent = fieldConfig.label;
                fieldDiv.appendChild(label);

                const input = createInputElement(fieldConfig, data[fieldConfig.key]);
                fieldDiv.appendChild(input);
                row1.appendChild(fieldDiv);
            });
            card.appendChild(row1);

            // 第二行字段
            const row2 = document.createElement("div");
            row2.className = "card-row";
            FIELDS_ROW2.forEach(fieldConfig => {
                const fieldDiv = document.createElement("div");
                fieldDiv.className = `field-group field-${fieldConfig.key}`;
                if (fieldConfig.wide) fieldDiv.classList.add("wide-field");
                if (fieldConfig.hideable) fieldDiv.classList.add("hideable");

                const label = document.createElement("label");
                label.textContent = fieldConfig.label;
                fieldDiv.appendChild(label);

                const input = createInputElement(fieldConfig, data[fieldConfig.key]);
                fieldDiv.appendChild(input);
                row2.appendChild(fieldDiv);
            });
            card.appendChild(row2);

            // 图片上传和删除按钮行
            const actionsRow = document.createElement("div");
            actionsRow.className = "card-actions";
            actionsRow.innerHTML = `
                <div class="image-upload-section">
                    <div class="image-preview-container" id="preview_${rowId}"></div>
                    <label class="btn-upload-label">
                        📷 选择图片（最多4张）
                        <input type="file" accept="image/*" multiple style="display:none" 
                               onchange="handleImageUpload(this, '${rowId}')">
                    </label>
                </div>
                <button class="btn-delete" onclick="deleteRow(this, '${rowId}')">🗑️ 删除此记录</button>
            `;
            card.appendChild(actionsRow);

	            document.getElementById("recordsContainer").appendChild(card);

	            // 根据当前害虫类型调整显示字段
	            applyPestTypeMode(card, document.getElementById("pestType").value);

	            // 更新所有行号
	            updateRowNumbers();
	        }

	        function applyFieldVisibility(card, visibleFieldKeys) {
	            ALL_FIELDS.forEach(fieldConfig => {
	                const fieldDiv = card.querySelector(`.field-${fieldConfig.key}`);
	                if (!fieldDiv) return;
	                fieldDiv.style.display = visibleFieldKeys.has(fieldConfig.key) ? "" : "none";
	            });
	        }

	        function applyChunchihuoMode(card) {
	            applyFieldVisibility(card, CHUNCHIHUO_VISIBLE_FIELD_KEYS);

	            // 上报时间：自动生成（可展示但不建议手改）
	            const reportTimeInput = card.querySelector(`[data-key="report_time"]`);
	            if (reportTimeInput) {
	                if (!reportTimeInput.value) reportTimeInput.value = getCurrentDateTimeString();
	                reportTimeInput.disabled = true;
	            }

	            // 保留但不展示的字段，设置默认值以不影响现有工作单生成逻辑
	            Object.keys(CHUNCHIHUO_HIDDEN_FIELD_DEFAULTS).forEach(field => {
	                const input = card.querySelector(`[data-key="${field}"]`);
	                if (input && !input.value) input.value = CHUNCHIHUO_HIDDEN_FIELD_DEFAULTS[field];
	            });
	        }

	        function applyDefaultMode(card) {
	            applyFieldVisibility(card, DEFAULT_VISIBLE_FIELD_KEYS);
	            const reportTimeInput = card.querySelector(`[data-key="report_time"]`);
	            if (reportTimeInput) reportTimeInput.disabled = false;
	        }

	        function applyPestTypeMode(card, pestType) {
	            if (pestType === "春尺蠖") {
	                applyChunchihuoMode(card);
	            } else {
	                applyDefaultMode(card);
	            }
	        }

        function deleteRow(btn, rowId) {
            rowImagesMap.delete(rowId);
            btn.closest('.record-card').remove();
            // 更新所有行号
            updateRowNumbers();
        }

        // 更新所有卡片的行号显示
        function updateRowNumbers() {
            const cards = document.querySelectorAll("#recordsContainer .record-card");
            cards.forEach((card, index) => {
                const rowNumber = card.querySelector(".row-number strong");
                if (rowNumber) {
                    rowNumber.textContent = String(index + 1).padStart(3, '0');
                }
            });
        }

        function handleImageUpload(input, rowId) {
            const files = Array.from(input.files).slice(0, 4); // 最多 4 张
            const previewContainer = document.getElementById(`preview_${rowId}`);
            const existingImages = rowImagesMap.get(rowId) || [];

            // 限制总数最多 4 张
            const remainingSlots = 4 - existingImages.length;
            const filesToProcess = files.slice(0, remainingSlots);

            filesToProcess.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    existingImages.push(base64);
                    rowImagesMap.set(rowId, existingImages);

                    // 创建预览缩略图
                    const thumb = document.createElement("div");
                    thumb.className = "image-thumb";
                    thumb.innerHTML = `
                        <img src="${base64}" alt="预览">
                        <span class="remove-thumb" onclick="removeImage('${rowId}', ${existingImages.length - 1}, this)">✕</span>
                    `;
                    previewContainer.appendChild(thumb);
                };
                reader.readAsDataURL(file);
            });

            // 清空 input 以便重复选择
            input.value = "";
        }

        function removeImage(rowId, index, btn) {
            const images = rowImagesMap.get(rowId);
            if (images) {
                images.splice(index, 1);
                rowImagesMap.set(rowId, images);
            }
            btn.closest('.image-thumb').remove();

            // 重新渲染预览以更新索引
            const previewContainer = document.getElementById(`preview_${rowId}`);
            previewContainer.innerHTML = '';
            images.forEach((base64, i) => {
                const thumb = document.createElement("div");
                thumb.className = "image-thumb";
                thumb.innerHTML = `
                    <img src="${base64}" alt="预览">
                    <span class="remove-thumb" onclick="removeImage('${rowId}', ${i}, this)">✕</span>
                `;
                previewContainer.appendChild(thumb);
            });
        }

        // AI智能解析文本
        async function parseTextWithAI() {
            const textInput = document.getElementById("aiTextInput");
            const statusDiv = document.getElementById("aiParseStatus");
            const text = textInput.value.trim();
            const pestType = document.getElementById("pestType").value;  // 获取当前害虫类型

            // 检查是否已选择害虫类型
            if (!pestType) {
                statusDiv.textContent = "⚠️ 请先选择害虫类型";
                statusDiv.className = "ai-parse-status error";
                return;
            }

            if (!text) {
                statusDiv.textContent = "⚠️ 请输入需要解析的文本";
                statusDiv.className = "ai-parse-status error";
                return;
            }

            statusDiv.textContent = "🔄 AI正在解析中，请稍候...";
            statusDiv.className = "ai-parse-status loading";

            try {
                const response = await fetch("/api/parse-text", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text, pest_type: pestType })  // 传递害虫类型
                });

                const result = await response.json();

                if (result.success && result.records) {
                    // 将解析结果添加到表格
                    result.records.forEach(record => {
                        addRow(record);
                    });

                    statusDiv.textContent = `✅ 成功解析 ${result.records.length} 条记录！`;
                    statusDiv.className = "ai-parse-status success";

                    // 清空输入框
                    textInput.value = "";
                } else {
                    throw new Error(result.error || "解析失败");
                }
            } catch (err) {
                statusDiv.textContent = `❌ ${err.message}`;
                statusDiv.className = "ai-parse-status error";
            }
        }

        // 保存到数据库（仅春尺蠖）
        async function saveToDatabase() {
            const btn = document.querySelector(".btn-save-db");
            const status = document.getElementById("statusMsg");
            const pestType = document.getElementById("pestType").value;

            if (pestType !== "春尺蠖") {
                alert("仅支持春尺蠖数据保存到数据库");
                return;
            }

            const cards = document.querySelectorAll("#recordsContainer .record-card");
            const records = Array.from(cards).map(card => {
                const record = {};
                card.querySelectorAll("input[data-key], textarea[data-key], select[data-key]").forEach(el => {
                    record[el.getAttribute("data-key")] = el.value;
                });
                return record;
            });

            if (records.length === 0) {
                alert("请至少添加一行数据！");
                return;
            }

            // 必填字段验证
            const requiredFields = [
                { key: "town_or_street", label: "乡镇/街道" },
                { key: "location_id", label: "点位编号" },
                { key: "location_name", label: "点位名称" },
                { key: "survey_date", label: "调查日期" },
                { key: "description", label: "详细情况描述" }
            ];

            const errors = [];
            records.forEach((record, index) => {
                const recordNum = index + 1;
                requiredFields.forEach(field => {
                    const value = record[field.key];
                    if (!value || value.trim() === "") {
                        errors.push(`第 ${recordNum} 条记录：${field.label} 不能为空`);
                    }
                });
            });

            if (errors.length > 0) {
                alert("⚠️ 请填写以下必填字段：\n\n" + errors.join("\n"));
                return;
            }

            btn.disabled = true;
            btn.textContent = "正在保存中...";
            status.textContent = "💾 正在保存到数据库，请稍候...";
            status.style.color = "white";

            try {
                const response = await fetch("/api/save-to-db", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        pest_type: pestType,
                        records: records
                    })
                });

                const result = await response.json();
                if (result.success) {
                    status.textContent = `✅ 成功保存 ${result.saved} 条记录到数据库！`;
                    status.style.color = "#2ecc71";
                    if (result.failed > 0) {
                        status.textContent += `\n⚠️ ${result.failed} 条记录保存失败`;
                    }
                } else {
                    throw new Error(result.error);
                }
            } catch (err) {
                status.textContent = `❌ 保存失败: ${err.message}`;
                status.style.color = "#e74c3c";
            } finally {
                btn.disabled = false;
                btn.textContent = "💾 保存到数据库";
            }
        }

        async function generateDocs() {
            const btn = document.querySelector(".btn-generate");
            const status = document.getElementById("statusMsg");

            const cards = document.querySelectorAll("#recordsContainer .record-card");
            const records = Array.from(cards).map(card => {
                const record = {};
                // 获取所有 input, textarea, select 的值
                card.querySelectorAll("input[data-key], textarea[data-key], select[data-key]").forEach(el => {
                    record[el.getAttribute("data-key")] = el.value;
                });
                // 附加该行的图片数据
                const rowId = card.getAttribute("data-row-id");
                record.images = rowImagesMap.get(rowId) || [];
                return record;
            });

            if (records.length === 0) {
                alert("请至少添加一行数据！");
                return;
            }

            // 必填字段验证
            const requiredFields = [
                { key: "town_or_street", label: "乡镇/街道" },
                { key: "location_id", label: "点位编号" },
                { key: "location_name", label: "点位名称" },
                { key: "survey_date", label: "调查日期" },
                { key: "description", label: "详细情况描述" }
            ];

            const errors = [];
            records.forEach((record, index) => {
                const recordNum = index + 1;
                requiredFields.forEach(field => {
                    const value = record[field.key];
                    if (!value || value.trim() === "") {
                        errors.push(`第 ${recordNum} 条记录：${field.label} 不能为空`);
                    }
                });
            });

            if (errors.length > 0) {
                alert("⚠️ 请填写以下必填字段：\n\n" + errors.join("\n"));
                return;
            }

            btn.disabled = true;
            btn.textContent = "正在飞速生成中...";
            status.textContent = "🚚 正在处理您的请求，请稍候...";
            status.style.color = "white";

            try {
                const response = await fetch("/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        pest_type: document.getElementById("pestType").value,
                        task_type: document.getElementById("taskType").value,
                        records: records
                    })
                });

                const result = await response.json();
                if (result.success) {
                    status.textContent = `✅ 成功生成 ${result.files.length} 份工作单！文件已保存至 output 目录。`;
                    status.style.color = "#2ecc71";
                } else {
                    throw new Error(result.error);
                }
            } catch (err) {
                status.textContent = `❌ 失败了: ${err.message}`;
                status.style.color = "#e74c3c";
            } finally {
                btn.disabled = false;
                btn.textContent = "🚀 批量生成工作单";
            }
        }

        // 处理害虫类型切换
	        function handlePestTypeChange() {
	            const pestType = document.getElementById("pestType").value;

	            // 处理每一个卡片
	            document.querySelectorAll("#recordsContainer .record-card").forEach(card => {
	                applyPestTypeMode(card, pestType);
	            });

	            // 控制"保存到数据库"按钮的显示
	            const btnSaveDb = document.getElementById("btnSaveDb");
	            if (pestType === "春尺蠖") {
	                btnSaveDb.style.display = "";
	            } else {
	                btnSaveDb.style.display = "none";
	            }
	        }

        // 页面初始化（不再默认添加空白行）
    </script>
</body>

</html>
