<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>林业调查工作单助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- 顶部导航栏 -->
    <nav class="site-nav">
        <div class="site-nav-inner">
            <span class="site-nav-brand">🌿 林业调查</span>
            <a href="/" class="nav-tab active">📋 派单生成</a>
            <a href="/records" class="nav-tab">📚 数据库</a>
            <a href="/map" class="nav-tab">🗺️ 地图</a>
        </div>
    </nav>

    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <div class="page-header">
            <div class="header-top">
                <span class="tag" id="yearTag">2025 · 林业调查</span>
                <span class="tag ghost">派单生成</span>
            </div>
            <h1>派单生成助手</h1>
            <p class="subtitle">将调查文本与现场记录快速转为结构化工作单，支持 AI 解析、图片留存与批量导出。</p>
            <div class="header-meta">
            </div>
        </div>

        <div class="section-title">基础配置</div>
        <div class="config-section">
            <div class="input-group">
                <label>害虫类型</label>
                <select id="pestType" onchange="handlePestTypeChange()">
                    <option value="" disabled selected>请选择害虫类型</option>
                    <option value="春尺蠖">春尺蠖</option>
                    <option value="国槐尺蠖">国槐尺蠖</option>
                    <option value="其他害虫">其他害虫</option>
                </select>
            </div>
            <div class="input-group">
                <label>统防任务类型</label>
                <select id="taskType">
                    <option value="">（空白）</option>
                    <option value="第一代">第一代</option>
                    <option value="第二代">第二代</option>
                    <option value="第三代">第三代</option>
                    <option value="越冬代">越冬代</option>
                </select>
            </div>
            <div class="input-group">
                <label>统防任务</label>
                <select id="task">
                    <option value="">（空白）</option>
                    <option value="监测">监测</option>
                    <option value="防治">防治</option>
                    <option value="普查">普查</option>
                    <option value="应急防治">应急防治</option>
                </select>
            </div>
        </div>
        <div class="flow-guide" aria-label="操作流程引导">
            <div class="flow-step">
                <span class="flow-step-index">1</span>
                <span>选择虫种</span>
            </div>
            <div class="flow-step">
                <span class="flow-step-index">2</span>
                <span>录入内容（AI 或手动）</span>
            </div>
            <div class="flow-step">
                <span class="flow-step-index">3</span>
                <span>生成工作单或保存数据库</span>
            </div>
        </div>

        <!-- AI文本解析区域 -->
        <div class="section-title">智能解析</div>
        <div class="ai-parse-section">
            <div class="ai-parse-header">
                <label for="aiTextInput">📝 粘贴调查记录文本（支持自由格式）</label>
                <button class="btn-ai-parse" onclick="parseTextWithAI()">🤖 AI智能解析</button>
            </div>
            <textarea id="aiTextInput" class="ai-text-input"
                placeholder="在此粘贴调查记录文本，例如：&#10;2025年1月15日，在某镇的道路绿化带发现美国白蛾网幕3个，受害杨树5株，点位编号L001...&#10;&#10;AI将自动识别并提取信息填充到下方表格中"></textarea>
            <div id="aiParseStatus" class="ai-parse-status"></div>
        </div>

        <!-- 卡片式数据容器 -->
        <div class="section-title">调查记录</div>
        <div class="records-toolbar">
            <button class="btn-add" onclick="addRow()">+ 添加一行调查数据</button>
            <div class="actions">
                <button class="btn-generate" onclick="generateDocs()">🚀 批量生成工作单</button>
                <button class="btn-save-db" id="btnSaveDb" onclick="saveToDatabase()" style="display:none">💾
                    保存到数据库</button>
            </div>
        </div>
        <div class="action-hint warning" id="actionHint">请先在“基础配置”中选择害虫类型，再进行智能解析或新增记录。</div>
        <div class="records-container" id="recordsContainer">
            <!-- 记录卡片将通过 JS 动态添加 -->
            <div id="emptyState" class="empty-state">
                <div class="empty-state-icon">🍃</div>
                <p>暂无调查记录。请在上方选择害虫并粘贴文本由 AI 提取，或点击上方按钮手动添加。</p>
            </div>
        </div>

        <div id="statusMsg" class="status-msg"></div>
    </div>

    <script>
        const yearTag = document.getElementById("yearTag");
        if (yearTag) {
            yearTag.textContent = `${new Date().getFullYear()} · 林业调查`;
        }
        document.title = `${new Date().getFullYear()} 林业调查工作单助手`;

        // AI文本框自适应高度
        document.addEventListener('DOMContentLoaded', () => {
            const aiTextInput = document.getElementById('aiTextInput');
            if (aiTextInput) {
                aiTextInput.addEventListener('input', function () {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight + 2) + 'px';
                });
            }
        });

        // 添加统一的 Toast 提示功能
        function showToast(message, type = 'info', duration = 3000) {
            let container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.className = 'toast-container';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            let icon = 'ℹ️';
            if (type === 'error') icon = '⚠️';
            else if (type === 'success') icon = '✅';
            else if (type === 'warning') icon = '🔔';

            toast.innerHTML = `<span style="font-size: 1.1em">${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('fade-out');
                toast.addEventListener('animationend', () => {
                    toast.remove();
                });
            }, duration);
        }

        function setPageStatus(message, type = "info") {
            const status = document.getElementById("statusMsg");
            if (!status) return;
            status.textContent = message || "";
            const colorMap = {
                info: "rgba(44, 47, 36, 0.8)",
                loading: "#1f4a35",
                success: "#2f7d4f",
                error: "#c1583a",
                warning: "#7a4e19"
            };
            status.style.color = colorMap[type] || colorMap.info;
        }

        // 大图预览 Lightbox 控制
        function openLightbox(src) {
            let lightbox = document.getElementById('lightbox');
            if (!lightbox) {
                lightbox = document.createElement('div');
                lightbox.id = 'lightbox';
                lightbox.className = 'lightbox';
                lightbox.innerHTML = `
                    <div class="lightbox-close" onclick="closeLightbox()">&times;</div>
                    <img id="lightboxImg" src="" onclick="event.stopPropagation()">
                `;
                // 点击背景关闭
                lightbox.addEventListener('click', closeLightbox);
                document.body.appendChild(lightbox);
            }
            const img = document.getElementById('lightboxImg');
            img.src = src;

            // 确保能触发动画
            requestAnimationFrame(() => {
                lightbox.classList.add('active');
            });
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            if (lightbox) {
                lightbox.classList.remove('active');
            }
        }

        // 字段配置：分两行布局
        const FIELDS_ROW1 = [
            { key: "survey_date", label: "调查日期", type: "date" },
            { key: "region", label: "区域", type: "select", options: ["乡镇", "城区"] },
            { key: "town_or_street", label: "乡镇/街道", type: "text" },
            { key: "location_id", label: "点位编号", type: "text" },
            { key: "location_name", label: "点位名称", type: "text" },
            { key: "occurrence_position", label: "发生位置", type: "text" },
            { key: "plot_type", label: "绿化性质", type: "text", hideable: true },
            { key: "pest_name", label: "害虫类别", type: "text", hideable: true }
        ];

        const FIELDS_ROW2 = [
            { key: "host_plant", label: "危害寄主", type: "text", hideable: true },
            { key: "damaged_count", label: "受害株数", type: "text", hideable: true },
            { key: "web_count", label: "网幕数", type: "text", hideable: true },
            { key: "total_insect_count", label: "总虫口数", type: "number", hideable: true },
            { key: "damage_level", label: "受害程度", type: "text", hideable: true },
            { key: "report_time", label: "上报日期", type: "date", hideable: true, placeholder: "自动生成" },
            { key: "description", label: "详细情况描述", type: "textarea", wide: true },
            { key: "note", label: "备注", type: "text", hideable: true }
        ];

        const ALL_FIELDS = [...FIELDS_ROW1, ...FIELDS_ROW2];

        // 默认模式（非春尺蠖）显示字段
        const DEFAULT_VISIBLE_FIELD_KEYS = new Set([
            "survey_date",
            "region",
            "town_or_street",
            "location_id",
            "location_name",
            "occurrence_position",
            "host_plant",
            "damaged_count",
            "web_count",
            "description",
            "note"
        ]);

        // 春尺蠖上报单模式：显示字段与数据库（chunchihuo_reports）保持一致
        const CHUNCHIHUO_VISIBLE_FIELD_KEYS = new Set([
            "survey_date",
            "region",
            "town_or_street",
            "location_id",
            "location_name",
            "occurrence_position",
            "plot_type",
            "total_insect_count",
            "damage_level",
            "report_time",
            "description"
        ]);

        // 其他害虫模式：包含地块类型、危害寄主、绿化性质和害虫类别，但不包含总虫口数和受害程度
        const QITA_HAICHONG_VISIBLE_FIELD_KEYS = new Set([
            "survey_date",
            "region",
            "town_or_street",
            "location_id",
            "location_name",
            "occurrence_position",
            "pest_name",
            "plot_type",
            "host_plant",
            "report_time",
            "description"
        ]);

        // 春尺蠖模式下不再预填隐藏字段默认值
        const CHUNCHIHUO_HIDDEN_FIELD_DEFAULTS = {};

        const CHUNCHIHUO_REMOVED_FIELD_KEYS = new Set([
            "host_plant",
            "damaged_count",
            "web_count"
        ]);

        const CHI_HUO_PEST_TYPES = new Set(["春尺蠖", "国槐尺蠖"]);
        const QITA_HAICHONG_PEST_TYPES = new Set(["其他害虫"]);

        const DEFAULT_ROW = {
            survey_date: new Date().toISOString().split('T')[0],
            region: "乡镇",
            town_or_street: "",
            location_id: "",
            location_name: "",
            occurrence_position: "",
            pest_name: "美国白蛾",
            plot_type: "",
            host_plant: "",
            damaged_count: "10",
            web_count: "0",
            total_insect_count: "",
            damage_level: "",
            report_time: "",
            description: "",
            note: ""
        };

        function stripChihuoFields(record) {
            CHUNCHIHUO_REMOVED_FIELD_KEYS.forEach(key => {
                if (key in record) delete record[key];
            });
        }

        function isChihuoType(pestType) {
            return CHI_HUO_PEST_TYPES.has(pestType);
        }

        function isQitaHaichongType(pestType) {
            return QITA_HAICHONG_PEST_TYPES.has(pestType);
        }

        // 用于存储每行的图片数据 (Base64)
        const rowImagesMap = new Map();
        let rowIdCounter = 0;

        // 日期格式转换函数：兼容多种 Excel 导出格式
        function parseDate(dateStr) {
            if (!dateStr) return "";

            // 如果已经是 yyyy-mm-dd 格式，直接返回
            if (/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) {
                return dateStr;
            }

            // 处理 yyyy/mm/dd 或 yyyy.mm.dd 格式
            let match = dateStr.match(/^(\d{4})[\/\.\-](\d{1,2})[\/\.\-](\d{1,2})/);
            if (match) {
                const [_, year, month, day] = match;
                return `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`;
            }

            // 处理 dd/mm/yyyy 或 mm/dd/yyyy 格式（假设为 mm/dd/yyyy，美国格式）
            match = dateStr.match(/^(\d{1,2})[\/\.\-](\d{1,2})[\/\.\-](\d{4})/);
            if (match) {
                const [_, first, second, year] = match;
                // 假设第一部分是月份，第二部分是日期（美国格式）
                return `${year}-${first.padStart(2, '0')}-${second.padStart(2, '0')}`;
            }

            // 处理 Excel 序列号（数字日期，如 44927 代表 2023-01-01）
            const numDate = parseFloat(dateStr);
            if (!isNaN(numDate) && numDate > 30000 && numDate < 60000) {
                // Excel 序列号转换为 JavaScript 日期
                const excelEpoch = new Date(1899, 11, 30); // Excel 的起始日期
                const jsDate = new Date(excelEpoch.getTime() + numDate * 24 * 60 * 60 * 1000);
                const year = jsDate.getFullYear();
                const month = String(jsDate.getMonth() + 1).padStart(2, '0');
                const day = String(jsDate.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // 尝试用 Date 对象解析
            const parsed = new Date(dateStr);
            if (!isNaN(parsed.getTime())) {
                const year = parsed.getFullYear();
                const month = String(parsed.getMonth() + 1).padStart(2, '0');
                const day = String(parsed.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }

            // 无法解析，返回原值
            return dateStr;
        }

        // 获取当前本地日期字符串（YYYY-MM-DD）
        function getCurrentDateString() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 创建输入元素的辅助函数
        function createInputElement(fieldConfig, value, id) {
            const { key, type, options, wide, placeholder } = fieldConfig;
            let element;

            if (type === "textarea") {
                element = document.createElement("textarea");
                element.rows = 2;
                element.value = value || '';
            } else if (type === "select") {
                element = document.createElement("select");
                options.forEach(opt => {
                    const option = document.createElement("option");
                    option.value = opt;
                    option.textContent = opt;
                    if (opt === value) option.selected = true;
                    element.appendChild(option);
                });
            } else if (type === "date") {
                element = document.createElement("input");
                element.type = "date";
                element.value = parseDate(value || '');
            } else if (type === "number") {
                element = document.createElement("input");
                element.type = "number";
                element.step = "1";
                element.value = value || '';
            } else {
                element = document.createElement("input");
                element.type = "text";
                element.value = value || '';
            }

            if (id) element.id = id;
            element.setAttribute("data-key", key);
            if (placeholder) element.placeholder = placeholder;
            if (wide) element.classList.add("wide-input");

            // 当用户修改内容时，如果原本有错误标红，则移除该标红
            element.addEventListener('input', function () {
                const parent = this.closest('.field-group');
                if (parent) parent.classList.remove('has-error');
            });

            return element;
        }

        function addRow(data = DEFAULT_ROW) {
            const pestType = document.getElementById("pestType").value;
            if (!pestType) {
                showToast("请先选择害虫类型", "warning");
                return;
            }
            const card = document.createElement("div");
            card.className = "record-card";
            const rowId = `row_${rowIdCounter++}`;
            card.setAttribute("data-row-id", rowId);
            rowImagesMap.set(rowId, []);

            // 卡片头部：显示行号
            const cardHeader = document.createElement("div");
            cardHeader.className = "card-header";
            cardHeader.innerHTML = `<span class="row-number">第 <strong>--</strong> 条记录</span>`;
            card.appendChild(cardHeader);

            // 字段网格区域：将所有字段放入一个整体的 CSS Grid 容器中，让浏览器自动换行并保持整齐排列
            const fieldsContainer = document.createElement("div");
            fieldsContainer.className = "card-fields-grid";

            ALL_FIELDS.forEach(fieldConfig => {
                const fieldDiv = document.createElement("div");
                fieldDiv.className = `field-group field-${fieldConfig.key}`;
                if (fieldConfig.wide) fieldDiv.classList.add("wide-field");
                if (fieldConfig.hideable) fieldDiv.classList.add("hideable");

                const inputId = `${fieldConfig.key}_${rowId}`;

                const label = document.createElement("label");
                label.textContent = fieldConfig.label;
                label.htmlFor = inputId;
                fieldDiv.appendChild(label);

                const input = createInputElement(fieldConfig, data[fieldConfig.key], inputId);
                fieldDiv.appendChild(input);
                fieldsContainer.appendChild(fieldDiv);
            });
            card.appendChild(fieldsContainer);


            // 图片上传和删除按钮行
            const actionsRow = document.createElement("div");
            actionsRow.className = "card-actions";
            actionsRow.innerHTML = `
                <div class="image-upload-section">
                    <div class="image-preview-container" id="preview_${rowId}"></div>
                    <label class="btn-upload-label">
                        📷 选择图片（最多4张）
                        <input type="file" accept="image/*" multiple style="display:none" 
                               onchange="handleImageUpload(this, '${rowId}')">
                    </label>
                </div>
                <button class="btn-delete" onclick="deleteRow(this, '${rowId}')">🗑️ 删除此记录</button>
            `;
            card.appendChild(actionsRow);

            document.getElementById("recordsContainer").appendChild(card);

            // 隐藏空状态
            const emptyState = document.getElementById("emptyState");
            if (emptyState) emptyState.style.display = "none";

            // 根据当前害虫类型调整显示字段
            applyPestTypeMode(card, document.getElementById("pestType").value);

            // 更新所有行号
            updateRowNumbers();
        }

        function applyFieldVisibility(card, visibleFieldKeys) {
            ALL_FIELDS.forEach(fieldConfig => {
                const fieldDiv = card.querySelector(`.field-${fieldConfig.key}`);
                if (!fieldDiv) return;
                fieldDiv.style.display = visibleFieldKeys.has(fieldConfig.key) ? "" : "none";
            });
        }

        function applyChunchihuoMode(card) {
            applyFieldVisibility(card, CHUNCHIHUO_VISIBLE_FIELD_KEYS);

            // 上报时间：自动生成
            const reportTimeInput = card.querySelector(`[data-key="report_time"]`);
            if (reportTimeInput) {
                if (!reportTimeInput.value) reportTimeInput.value = getCurrentDateString();
                reportTimeInput.disabled = true;
            }

            // 地块类型：最标改为“地块类型”，预填并锁定为“平原造林”
            const plotTypeInput = card.querySelector(`[data-key="plot_type"]`);
            if (plotTypeInput) {
                if (!plotTypeInput.value) plotTypeInput.value = "平原造林";
                plotTypeInput.disabled = true;
                const label = card.querySelector(`.field-plot_type label`);
                if (label) label.textContent = "地块类型";
            }

            // 保留但不展示的字段默认值
            Object.keys(CHUNCHIHUO_HIDDEN_FIELD_DEFAULTS).forEach(field => {
                const input = card.querySelector(`[data-key="${field}"]`);
                if (input && !input.value) input.value = CHUNCHIHUO_HIDDEN_FIELD_DEFAULTS[field];
            });
        }

        function applyQitaHaichongMode(card) {
            applyFieldVisibility(card, QITA_HAICHONG_VISIBLE_FIELD_KEYS);

            // 上报时间：自动生成
            const reportTimeInput = card.querySelector(`[data-key="report_time"]`);
            if (reportTimeInput) {
                if (!reportTimeInput.value) reportTimeInput.value = getCurrentDateString();
                reportTimeInput.disabled = true;
            }

            // 恢复 plot_type 标签为“绿化性质”并解锁
            const plotTypeInput = card.querySelector(`[data-key="plot_type"]`);
            if (plotTypeInput) {
                plotTypeInput.disabled = false;
                const label = card.querySelector(`.field-plot_type label`);
                if (label) label.textContent = "绿化性质";
            }
        }

        function applyDefaultMode(card) {
            applyFieldVisibility(card, DEFAULT_VISIBLE_FIELD_KEYS);
            const reportTimeInput = card.querySelector(`[data-key="report_time"]`);
            if (reportTimeInput) reportTimeInput.disabled = false;

            // 恢复 plot_type 标签为“绿化性质”并解锁
            const plotTypeInput = card.querySelector(`[data-key="plot_type"]`);
            if (plotTypeInput) {
                plotTypeInput.disabled = false;
                const label = card.querySelector(`.field-plot_type label`);
                if (label) label.textContent = "绿化性质";
            }
        }

        function applyPestTypeMode(card, pestType) {
            if (isChihuoType(pestType)) {
                applyChunchihuoMode(card);
            } else if (isQitaHaichongType(pestType)) {
                applyQitaHaichongMode(card);
            } else {
                applyDefaultMode(card);
            }
        }

        function deleteRow(btn, rowId) {
            rowImagesMap.delete(rowId);
            btn.closest('.record-card').remove();
            // 更新所有行号
            updateRowNumbers();

            // 检查是否需要显示空状态
            const cards = document.querySelectorAll("#recordsContainer .record-card");
            if (cards.length === 0) {
                const emptyState = document.getElementById("emptyState");
                if (emptyState) emptyState.style.display = "flex";
            }
        }

        // 更新所有卡片的行号显示
        function updateRowNumbers() {
            const cards = document.querySelectorAll("#recordsContainer .record-card");
            cards.forEach((card, index) => {
                const rowNumber = card.querySelector(".row-number strong");
                if (rowNumber) {
                    rowNumber.textContent = String(index + 1).padStart(3, '0');
                }
            });
        }

        function handleImageUpload(input, rowId) {
            const files = Array.from(input.files).slice(0, 4); // 最多 4 张
            const previewContainer = document.getElementById(`preview_${rowId}`);
            const existingImages = rowImagesMap.get(rowId) || [];

            // 限制总数最多 4 张
            const remainingSlots = 4 - existingImages.length;
            const filesToProcess = files.slice(0, remainingSlots);

            filesToProcess.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    existingImages.push(base64);
                    rowImagesMap.set(rowId, existingImages);

                    // 创建预览缩略图
                    const thumb = document.createElement("div");
                    thumb.className = "image-thumb";
                    thumb.innerHTML = `
                        <img src="${base64}" alt="预览" onclick="openLightbox(this.src)">
                        <span class="remove-thumb" onclick="removeImage('${rowId}', ${existingImages.length - 1}, this)">✕</span>
                    `;
                    previewContainer.appendChild(thumb);
                };
                reader.readAsDataURL(file);
            });

            // 清空 input 以便重复选择
            input.value = "";
        }

        function removeImage(rowId, index, btn) {
            const images = rowImagesMap.get(rowId);
            if (images) {
                images.splice(index, 1);
                rowImagesMap.set(rowId, images);
            }
            btn.closest('.image-thumb').remove();

            // 重新渲染预览以更新索引
            const previewContainer = document.getElementById(`preview_${rowId}`);
            previewContainer.innerHTML = '';
            images.forEach((base64, i) => {
                const thumb = document.createElement("div");
                thumb.className = "image-thumb";
                thumb.innerHTML = `
                    <img src="${base64}" alt="预览" onclick="openLightbox(this.src)">
                    <span class="remove-thumb" onclick="removeImage('${rowId}', ${i}, this)">✕</span>
                `;
                previewContainer.appendChild(thumb);
            });
        }

        // AI智能解析文本
        async function parseTextWithAI() {
            const textInput = document.getElementById("aiTextInput");
            const statusDiv = document.getElementById("aiParseStatus");
            const text = textInput.value.trim();
            const pestType = document.getElementById("pestType").value;  // 获取当前害虫类型
            if (statusDiv) {
                statusDiv.textContent = "";
                statusDiv.className = "ai-parse-status";
            }

            // 检查是否已选择害虫类型
            if (!pestType) {
                showToast("请先选择害虫类型", "warning");
                setPageStatus("请先选择害虫类型后再执行 AI 解析。", "warning");
                return;
            }

            if (!text) {
                showToast("请输入需要解析的文本", "warning");
                setPageStatus("请先输入调查文本，再执行 AI 解析。", "warning");
                return;
            }

            setPageStatus("🔄 AI 正在解析文本，请稍候...", "loading");

            try {
                const response = await fetch("/api/parse-text", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text, pest_type: pestType })  // 传递害虫类型
                });

                const result = await response.json();

                if (result.success && result.records) {
                    // 将解析结果添加到表格
                    result.records.forEach(record => {
                        if (isChihuoType(pestType)) {
                            stripChihuoFields(record);
                        }
                        addRow(record);
                    });

                    showToast(`成功解析 ${result.records.length} 条记录`, "success");
                    setPageStatus(`✅ 已完成 AI 解析，新增 ${result.records.length} 条记录。`, "success");

                    // 清空输入框
                    textInput.value = "";
                } else {
                    throw new Error(result.error || "解析失败");
                }
            } catch (err) {
                setPageStatus(`❌ AI 解析失败：${err.message}`, "error");
            }
        }

        // 保存到数据库（仅尺蠖类）
        async function saveToDatabase() {
            const btn = document.querySelector(".btn-save-db");
            const status = document.getElementById("statusMsg");
            const pestType = document.getElementById("pestType").value;

            if (!isChihuoType(pestType) && !isQitaHaichongType(pestType)) {
                showToast("仅支持春尺蠖/国槐尺蠖/其他害虫数据保存到数据库", "warning");
                return;
            }

            const cards = document.querySelectorAll("#recordsContainer .record-card");
            const records = Array.from(cards).map(card => {
                const record = {};
                card.querySelectorAll("input[data-key], textarea[data-key], select[data-key]").forEach(el => {
                    record[el.getAttribute("data-key")] = el.value;
                });
                if (isChihuoType(pestType)) {
                    stripChihuoFields(record);
                }
                return record;
            });

            if (records.length === 0) {
                showToast("请至少添加一行数据！", "warning");
                return;
            }

            // 必填字段验证
            const requiredFields = [
                { key: "town_or_street", label: "乡镇/街道" },
                { key: "location_id", label: "点位编号" },
                { key: "location_name", label: "点位名称" },
                { key: "survey_date", label: "调查日期" },
                { key: "description", label: "详细情况描述" }
            ];

            let hasValidationErrors = false;
            // 清除之前的错误状态
            cards.forEach(card => {
                card.querySelectorAll('.has-error').forEach(el => el.classList.remove('has-error'));
            });

            records.forEach((record, index) => {
                const card = cards[index];
                requiredFields.forEach(field => {
                    const fieldDiv = card.querySelector(`.field-${field.key}`);
                    // 仅验证当前模式下可见的字段
                    if (fieldDiv && fieldDiv.style.display !== 'none') {
                        const value = record[field.key];
                        if (!value || value.trim() === "") {
                            fieldDiv.classList.add('has-error');
                            hasValidationErrors = true;
                        }
                    }
                });
            });

            if (hasValidationErrors) {
                showToast("请填写标红的必填字段", "error");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "<span class='spinner' style='border-color: rgba(122,78,25,0.2); border-top-color: #7a4e19;'></span> 正在保存...";
            setPageStatus("💾 正在保存到数据库，请稍候...", "loading");

            try {
                const response = await fetch("/api/save-to-db", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        pest_type: pestType,
                        records: records
                    })
                });

                const result = await response.json();
                if (result.success) {
                    setPageStatus(`✅ 成功保存 ${result.saved} 条记录到数据库！`, "success");
                    if (result.failed > 0) {
                        setPageStatus(`✅ 成功保存 ${result.saved} 条，⚠️ ${result.failed} 条失败`, "warning");
                    }
                } else {
                    throw new Error(result.error);
                }
            } catch (err) {
                setPageStatus(`❌ 保存失败: ${err.message}`, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "💾 保存到数据库";
            }
        }

        async function generateDocs() {
            const btn = document.querySelector(".btn-generate");
            const status = document.getElementById("statusMsg");

            const cards = document.querySelectorAll("#recordsContainer .record-card");
            const records = Array.from(cards).map(card => {
                const record = {};
                // 获取所有 input, textarea, select 的值
                card.querySelectorAll("input[data-key], textarea[data-key], select[data-key]").forEach(el => {
                    record[el.getAttribute("data-key")] = el.value;
                });
                // 附加该行的图片数据
                const rowId = card.getAttribute("data-row-id");
                record.images = rowImagesMap.get(rowId) || [];
                if (isChihuoType(document.getElementById("pestType").value)) {
                    stripChihuoFields(record);
                }
                return record;
            });

            if (records.length === 0) {
                showToast("请至少添加一行数据！", "warning");
                return;
            }

            // 必填字段验证
            const requiredFields = [
                { key: "town_or_street", label: "乡镇/街道" },
                { key: "location_id", label: "点位编号" },
                { key: "location_name", label: "点位名称" },
                { key: "survey_date", label: "调查日期" },
                { key: "description", label: "详细情况描述" }
            ];

            let hasValidationErrors = false;
            // 清除之前的错误状态
            cards.forEach(card => {
                card.querySelectorAll('.has-error').forEach(el => el.classList.remove('has-error'));
            });

            records.forEach((record, index) => {
                const card = cards[index];
                requiredFields.forEach(field => {
                    const fieldDiv = card.querySelector(`.field-${field.key}`);
                    if (fieldDiv && fieldDiv.style.display !== 'none') {
                        const value = record[field.key];
                        if (!value || value.trim() === "") {
                            fieldDiv.classList.add('has-error');
                            hasValidationErrors = true;
                        }
                    }
                });
            });

            if (hasValidationErrors) {
                showToast("请填写标红的必填字段", "error");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "<span class='spinner'></span> 正在生成...";
            setPageStatus("🚚 正在处理您的请求，请稍候...", "loading");

            try {
                const response = await fetch("/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        pest_type: document.getElementById("pestType").value,
                        task_type: document.getElementById("taskType").value,
                        task: document.getElementById("task").value,
                        records: records
                    })
                });

                if (!response.ok) {
                    // 如果响应不成功，尝试解析错误信息
                    const errorData = await response.json();
                    throw new Error(errorData.error || "生成失败");
                }

                // 检查响应类型
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    // JSON 响应（错误情况）
                    const result = await response.json();
                    throw new Error(result.error || "生成失败");
                } else {
                    // 文件响应（成功情况）
                    const blob = await response.blob();
                    const contentDisposition = response.headers.get("content-disposition");
                    let filename = "工作单.docx";

                    // 从响应头中提取文件名（优先处理 RFC 5987 的 filename*）
                    if (contentDisposition) {
                        const starMatch = /filename\*\s*=\s*([^;]+)/i.exec(contentDisposition);
                        if (starMatch && starMatch[1]) {
                            const rawValue = starMatch[1].trim().replace(/^["']|["']$/g, "");
                            const rfc5987Match = /^([^']*)'[^']*'(.*)$/.exec(rawValue);
                            const encodedPart = rfc5987Match ? rfc5987Match[2] : rawValue;
                            try {
                                filename = decodeURIComponent(encodedPart);
                            } catch (e) {
                                filename = encodedPart;
                            }
                        } else {
                            const matches = /filename\s*=\s*([^;]+)/i.exec(contentDisposition);
                            if (matches && matches[1]) {
                                filename = matches[1].trim().replace(/^["']|["']$/g, "");
                            }
                        }
                    }

                    // 创建下载链接并触发下载
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    setPageStatus("✅ 成功生成工作单！文件已开始下载。", "success");
                }
            } catch (err) {
                setPageStatus(`❌ 失败了: ${err.message}`, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = "🚀 批量生成工作单";
            }
        }

        // 统防任务类型和统防任务的初始选项（用于切换回通用模式时恢复）
        const TASK_TYPE_DEFAULT_OPTIONS = [
            { value: "", label: "（空白）" },
            { value: "第一代", label: "第一代" },
            { value: "第二代", label: "第二代" },
            { value: "第三代", label: "第三代" },
            { value: "越冬代", label: "越冬代" },
        ];
        const TASK_DEFAULT_OPTIONS = [
            { value: "", label: "（空白）" },
            { value: "监测", label: "监测" },
            { value: "防治", label: "防治" },
            { value: "普查", label: "普查" },
            { value: "应急防治", label: "应急防治" },
        ];

        // 替换下拉框的选项列表并设置选中值
        function setSelectOptions(selectEl, options, selectedValue) {
            selectEl.innerHTML = "";
            options.forEach(opt => {
                const el = document.createElement("option");
                el.value = opt.value;
                el.textContent = opt.label;
                if (opt.value === selectedValue) el.selected = true;
                selectEl.appendChild(el);
            });
        }

        // 处理害虫类型切换
        function handlePestTypeChange() {
            const pestType = document.getElementById("pestType").value;
            const taskTypeEl = document.getElementById("taskType");
            const taskEl = document.getElementById("task");

            // 春尺蠖：锁定统防任务类型，替换统防任务选项
            if (pestType === "春尺蠖") {
                setSelectOptions(taskTypeEl, [{ value: "春尺蠖防治", label: "春尺蠖防治" }], "春尺蠖防治");
                taskTypeEl.disabled = true;
                setSelectOptions(taskEl, [
                    { value: "", label: "（空白）" },
                    { value: "2026春尺蠖防治", label: "2026春尺蠖防治" },
                ], "");
                taskEl.disabled = false;
            } else {
                // 其他虫种：恢复通用选项
                const currentTaskType = taskTypeEl.value;
                const currentTask = taskEl.value;
                setSelectOptions(taskTypeEl, TASK_TYPE_DEFAULT_OPTIONS, currentTaskType);
                taskTypeEl.disabled = false;
                setSelectOptions(taskEl, TASK_DEFAULT_OPTIONS, currentTask);
                taskEl.disabled = false;
            }

            // 处理每一个卡片
            document.querySelectorAll("#recordsContainer .record-card").forEach(card => {
                applyPestTypeMode(card, pestType);
            });

            // 控制"保存到数据库"按钮的显示
            const btnSaveDb = document.getElementById("btnSaveDb");
            if (isChihuoType(pestType) || isQitaHaichongType(pestType)) {
                btnSaveDb.style.display = "";
            } else {
                btnSaveDb.style.display = "none";
            }

            updatePestTypeDependentUI();
        }

        function updatePestTypeDependentUI() {
            const pestType = document.getElementById("pestType").value;
            const disableActions = !pestType;
            const btnAdd = document.querySelector(".btn-add");
            const btnAiParse = document.querySelector(".btn-ai-parse");
            const btnGenerate = document.querySelector(".btn-generate");
            const actionHint = document.getElementById("actionHint");
            if (btnAdd) btnAdd.disabled = disableActions;
            if (btnAiParse) btnAiParse.disabled = disableActions;
            if (btnGenerate) btnGenerate.disabled = disableActions;

            if (disableActions) {
                if (btnAdd) btnAdd.title = "请先选择害虫类型";
                if (btnAiParse) btnAiParse.title = "请先选择害虫类型";
                if (btnGenerate) btnGenerate.title = "请先选择害虫类型";
                if (actionHint) {
                    actionHint.className = "action-hint warning";
                    actionHint.textContent = "请先在“基础配置”中选择害虫类型，再进行智能解析或新增记录。";
                }
            } else {
                if (btnAdd) btnAdd.title = "";
                if (btnAiParse) btnAiParse.title = "";
                if (btnGenerate) btnGenerate.title = "";
                if (actionHint) {
                    actionHint.className = "action-hint ready";
                    actionHint.textContent = `当前已选择：${pestType}。下一步可用 AI 解析或手动新增记录，然后生成工作单或保存数据库。`;
                }
            }
        }

        // 页面初始化（不再默认添加空白行）
        updatePestTypeDependentUI();
    </script>
