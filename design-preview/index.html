<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>林业调查工作台</title>
  <style>
    :root {
      --bg: oklch(97.8% 0.006 155);
      --surface: oklch(100% 0 0);
      --fg: oklch(20% 0.036 158);
      --muted: oklch(50% 0.022 158);
      --border: oklch(89% 0.014 155);
      --accent: oklch(43% 0.105 155);
      --nav: oklch(25% 0.072 157);
      --font-display: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; width: 20px; height: 20px; }
    h1, h2 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .topbar { border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 94%, transparent); backdrop-filter: blur(12px); }
    .container { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
    .topbar-inner { min-height: 68px; display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; background: var(--nav); color: var(--surface); }
    .brand-copy strong, .brand-copy span { display: block; }
    .brand-copy strong { font-family: var(--font-display); font-size: 16px; }
    .brand-copy span { color: var(--muted); font-family: var(--font-mono); font-size: 9px; letter-spacing: .08em; }
    .topbar-note { margin-left: auto; color: var(--muted); font-size: 11px; }
    .login-button { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 15px; border: 1px solid color-mix(in oklch, var(--accent) 30%, var(--border)); border-radius: 9px; background: var(--surface); color: var(--nav); font-size: 12px; font-weight: 650; transition: background 160ms ease, border-color 160ms ease, color 160ms ease; }
    .login-button:hover { border-color: var(--accent); background: var(--nav); color: var(--surface); }
    .login-button svg { width: 17px; height: 17px; }
    .main { display: grid; align-items: center; padding-block: 56px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 30px; }
    .eyebrow { margin: 0 0 12px; color: var(--accent); font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; }
    h1 { max-width: 13ch; font-size: clamp(38px, 5vw, 62px); line-height: 1.08; }
    .intro p:last-child { max-width: 42ch; margin: 0; color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card { min-height: 260px; display: flex; flex-direction: column; padding: 22px; border: 1px solid var(--border); border-radius: 13px; background: var(--surface); transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease; }
    .card:hover { transform: translateY(-3px); border-color: color-mix(in oklch, var(--accent) 35%, var(--border)); box-shadow: 0 16px 40px color-mix(in oklch, var(--fg) 9%, transparent); }
    .card.primary { grid-column: span 2; background: var(--nav); color: var(--surface); }
    .card-icon { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 10px; color: var(--nav); }
    .primary .card-icon { border-color: color-mix(in oklch, var(--surface) 18%, transparent); color: var(--surface); }
    .card h2 { margin-top: auto; font-size: 23px; }
    .card p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .primary p { color: color-mix(in oklch, var(--surface) 62%, transparent); }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-family: var(--font-mono); font-size: 9px; }
    .primary .card-meta { border-color: color-mix(in oklch, var(--surface) 14%, transparent); color: color-mix(in oklch, var(--surface) 56%, transparent); }
    .foot { padding: 22px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 10px; }
    @media (max-width: 820px) {
      .intro { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: 1fr 1fr; }
      .card.primary { grid-column: auto; }
    }
    @media (max-width: 560px) {
      .container { width: min(100% - 24px, 1120px); }
      .topbar-note, .brand-copy span { display: none; }
      .login-button { margin-left: auto; }
      .main { align-items: start; padding-block: 36px; }
      .grid { grid-template-columns: 1fr; }
      .card.primary { grid-column: auto; }
      .card { min-height: 210px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="container topbar-inner">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 7 10h3l-4 6h5v5h2v-5h5l-4-6h3Z"/></svg></span>
        <span class="brand-copy"><strong>林业调查工作台</strong><span>FORESTRY SURVEY WORKBENCH</span></span>
        <span class="topbar-note">北京市林业有害生物调查系统</span>
        <a class="login-button" href="login.html" aria-label="登录林业调查工作台">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5m5 5H3"/></svg>
          <span>登录</span>
        </a>
      </div>
    </header>
    <main class="main">
      <section class="container" data-od-id="launcher">
        <div class="intro">
          <div><p class="eyebrow">统一调查数据与地图点位</p><h1>选择要进入的工作界面。</h1></div>
          <p>从调查点位地图掌握区域风险，或进入工单录入完成现场记录、附件整理与标准化 Word 导出。</p>
        </div>
        <div class="grid">
          <a class="card primary" href="map.html">
            <span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3Z"/><path d="M9 3v15m6-12v15"/></svg></span>
            <h2>调查点位地图</h2>
            <p>查看北京市区县点位聚合、状态分类、图层工具和调查详情。</p>
            <span class="card-meta"><span>GIS WORKBENCH</span><span>进入地图 →</span></span>
          </a>
          <a class="card" href="workorder.html">
            <span class="card-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 3h10v4H7zM5 5H4v16h16V5h-1M8 12h8M8 16h5"/></svg></span>
            <h2>工单录入</h2>
            <p>录入调查数据、管理现场附件并导出标准化 Word 工单。</p>
            <span class="card-meta"><span>WORK ORDER</span><span>开始录入 →</span></span>
          </a>
        </div>
      </section>
    </main>
    <footer class="foot"><div class="container">数据分级保护 · 操作全程留痕 · 北京市林业有害生物调查系统</div></footer>
  </div>
</body>
</html>
